<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访客模式 — Robotics Daily Papers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7B2C9F;
            --primary-hover: #6B1F8F;
            --secondary: #B794D3;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background: #f8fafc;
        }
        #topbar {
            flex-shrink: 0;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.1rem;
            /* Soft white → lavender gradient gives the bar life without
               competing with the iframe content below. */
            background:
                linear-gradient(180deg,
                    rgba(255, 255, 255, 0.92) 0%,
                    rgba(247, 240, 255, 0.82) 100%);
            border-bottom: 1px solid rgba(226, 232, 240, 0.85);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            /* Top inner highlight + bottom soft shadow for depth */
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.7),
                0 1px 12px rgba(123, 44, 159, 0.06);
            font-size: 0.85rem;
            position: relative;
        }
        /* Decorative bottom gradient line — subtle purple accent that ties
           the bar to the rest of the design system. */
        #topbar::before {
            content: "";
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(123, 44, 159, 0.24) 50%,
                transparent 100%);
            pointer-events: none;
        }
        /* Faint radial bloom at the top-right for a touch of warmth */
        #topbar::after {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 280px;
            background: radial-gradient(circle at 100% 50%,
                rgba(183, 148, 211, 0.18) 0%,
                transparent 70%);
            pointer-events: none;
        }
        #topbar > * { position: relative; z-index: 1; }
        #topbar .left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            color: var(--text);
        }
        #topbar .badge {
            background: rgba(100, 116, 139, 0.15);
            color: #475569;
            padding: 0.18rem 0.6rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        #topbar .right {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        #topbar .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            padding: 0.36rem 0.75rem;
            border-radius: 0.5rem;
            transition: background 0.15s ease, color 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        #topbar .nav-link:hover {
            color: var(--primary);
            background: rgba(123, 44, 159, 0.08);
        }
        #topbar .nav-link svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            opacity: 0.85;
        }
        #topbar .login-btn {
            color: #fff;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.38rem 0.95rem;
            border-radius: 0.55rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 3px 10px rgba(123, 44, 159, 0.28);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-left: 0.4rem;
        }
        #topbar .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(123, 44, 159, 0.36);
        }
        #topbar .login-btn svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }
        @media (max-width: 720px) {
            #topbar .nav-link .nav-label,
            #topbar .login-btn .nav-label {
                display: none;
            }
            #topbar .nav-link, #topbar .login-btn {
                padding: 0.42rem 0.6rem;
                gap: 0;
            }
            #topbar .nav-link svg, #topbar .login-btn svg {
                width: 16px;
                height: 16px;
            }
        }
        #content-wrapper {
            flex: 1 1 auto;
            overflow: hidden;
            position: relative;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading-message, #error-message {
            padding: 3rem 1rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        #error-message p { color: #b91c1c; margin: 0; }
        #error-message a { color: var(--primary); }

        #footer {
            flex-shrink: 0;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-top: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.7);
        }
        .repo-link {
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            transition: opacity 0.2s ease;
        }
        .repo-link:hover { opacity: 0.7; }
        .repo-icon { width: 22px; height: 22px; }

        @media (max-width: 600px) {
            #topbar { padding: 0 0.75rem; height: auto; flex-wrap: wrap; gap: 0.4rem; padding-top: 0.4rem; padding-bottom: 0.4rem; }
            #topbar .nav-link { padding: 0.28rem 0.55rem; }
            #topbar .login-btn { margin-left: 0.2rem; }
        }
    </style>
    <script>
        async function loadLatestReportIntoIframe() {
            const iframe = document.getElementById('report-frame');
            const loadingMessage = document.getElementById('loading-message');
            const errorMessageDiv = document.getElementById('error-message');

            try {
                const response = await fetch('reports.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const reports = await response.json();

                if (reports && reports.length > 0) {
                    const latestReportFile = reports[0];
                    iframe.src = `./daily_html/${latestReportFile}`;
                    document.title = `访客模式 - ${latestReportFile.replace('.html', '').replace(/_/g, '-')}`;
                    loadingMessage.style.display = 'none';
                    iframe.style.display = 'block';
                } else {
                    throw new Error('未找到最新的报告文件。请确保 reports.json 存在并包含报告列表。');
                }
            } catch (error) {
                console.error('Error loading report:', error);
                loadingMessage.style.display = 'none';
                errorMessageDiv.innerHTML = `<p>加载最新报告时出错：${error.message} 请 <a href="./list.html">查看报告列表</a>。</p>`;
                errorMessageDiv.style.display = 'block';
            }
        }
        window.addEventListener('DOMContentLoaded', loadLatestReportIntoIframe);
    </script>
</head>
<body>
    <div id="topbar">
        <div class="left">
            <span>Robotics Daily Papers</span>
            <span class="badge">只读网页版</span>
        </div>
        <div class="right">
            <a class="nav-link" href="list.html" title="报告列表">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span class="nav-label">报告列表</span>
            </a>
            <a class="nav-link" href="search.html" title="论文检索">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-3.5-3.5"/></svg>
                <span class="nav-label">论文检索</span>
            </a>
            <a class="login-btn" href="https://github.com/Robotics-paper-daily/Robotics-paper-daily.github.io/releases/latest" title="下载 PaperReader（macOS / Windows）">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 21h14"/></svg>
                <span class="nav-label">下载 App</span>
            </a>
        </div>
    </div>
    <div id="content-wrapper">
        <div id="loading-message">正在加载最新报告，请稍候…</div>
        <div id="error-message" style="display: none;"></div>
        <iframe id="report-frame" style="display: none;"></iframe>
    </div>
    <div id="footer">
        <a class="repo-link" href="https://github.com/Robotics-paper-daily/Robotics-paper-daily.github.io" target="_blank" rel="noopener noreferrer" title="Project Repository" aria-label="Project Repository">
            <svg class="repo-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.7 7.7 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
        </a>
    </div>
</body>
</html>
