<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>最新 ArXiv Robotics 报告</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%; /* Use percentage height */
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }
        #content-wrapper {
            flex: 1 1 auto; /* Grow, shrink, basis auto */
            overflow: hidden; /* Contain the iframe */
            position: relative; /* Needed for absolute positioning of iframe if required */
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%; /* Make iframe fill its container */
            display: block; /* Ensure iframe is treated as a block element */
        }
        #footer {
            flex-shrink: 0; /* Prevent footer from shrinking */
            height: 46px; /* Give footer a fixed height */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-top: 1px solid #eee; /* Optional: add a separator */
        }
        .repo-link {
            color: #7B2C9F;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease;
        }
        .repo-link:hover {
            opacity: 0.75;
        }
        .repo-icon {
            width: 22px;
            height: 22px;
            display: block;
        }
        #loading-message, #error-message {
            padding: 20px;
            text-align: center;
            margin-top: 50px;
        }
        #error-message p {
             color: red;
        }
    </style>
    <script>
        async function loadLatestReportIntoIframe() {
            const iframe = document.getElementById('report-frame');
            const loadingMessage = document.getElementById('loading-message');
            const errorMessageDiv = document.getElementById('error-message');

            try {
                const response = await fetch('reports.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const reports = await response.json();

                if (reports && reports.length > 0) {
                    // Assuming reports are sorted newest first or we take the first one
                    const latestReportFile = reports[0]; 
                    const latestReportUrl = `./daily_html/${latestReportFile}`;
                    
                    iframe.src = latestReportUrl;
                    // Update the main page title based on the loaded report
                    document.title = `ArXiv Robotics 报告 - ${latestReportFile.replace('.html', '').replace(/_/g, '-')}`;
                    loadingMessage.style.display = 'none'; // Hide loading message
                    iframe.style.display = 'block'; // Show iframe

                } else {
                    throw new Error('无法找到最新的报告文件。请确保 reports.json 文件存在且包含报告列表。');
                }
            } catch (error) {
                console.error('Error loading report:', error);
                loadingMessage.style.display = 'none'; // Hide loading message
                errorMessageDiv.innerHTML = `<p style="color: red; text-align: center; margin-top: 50px;">加载最新报告时出错: ${error.message} 请 <a href="./list.html">查看报告列表</a>。</p>`;
                errorMessageDiv.style.display = 'block'; // Show error message
            }
        }

        // Execute the loading function when the page loads
        window.onload = loadLatestReportIntoIframe;
    </script>
</head>
<body>
    <div id="content-wrapper">
        <div id="loading-message">
            <p>正在加载最新报告，请稍候...</p>
        </div>
        <div id="error-message" style="display: none;">
            <!-- Error messages will be displayed here -->
        </div>
        <iframe id="report-frame" style="display: none;"></iframe>
    </div>
    <div id="footer">
        <a class="repo-link" href="https://github.com/Robotics-paper-daily/Robotics-paper-daily.github.io" target="_blank" rel="noopener noreferrer" title="Project Repository" aria-label="Project Repository">
            <svg class="repo-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38
                0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
                .07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
                -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.7 7.7 0 0 1 2-.27c.68 0 1.36.09 2 .27
                1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15
                0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
                0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
        </a>
    </div>
</body>
</html>
