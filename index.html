<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics Daily Papers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --text-muted-color: #64748b;
            --header-color: #0f172a;
            --highlight-primary: #7B2C9F;
            --highlight-secondary: #B794D3;
            --border-color: #e2e8f0;
            --shadow-color: rgba(15, 23, 42, 0.08);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f3e8ff 100%);
            color: var(--text-color);
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
        }
        .gate-card {
            max-width: 460px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(226, 232, 240, 0.7);
            border-radius: 1rem;
            box-shadow: 0 14px 40px var(--shadow-color);
            padding: 2.4rem 2.2rem 2rem;
            text-align: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }
        .gate-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--highlight-primary), var(--highlight-secondary));
        }
        .gate-card .logo {
            width: 44px;
            height: 44px;
            margin: 0 auto 0.9rem;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--highlight-primary), var(--highlight-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(123, 44, 159, 0.32);
        }
        .gate-card .logo svg {
            width: 24px;
            height: 24px;
            color: #fff;
        }
        .gate-card h1 {
            margin: 0 0 0.4rem;
            font-size: 1.6rem;
            color: var(--header-color);
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .gate-card .tagline {
            font-size: 0.92rem;
            color: var(--text-muted-color);
            margin: 0 0 1.6rem;
            line-height: 1.6;
        }
        .gate-card .topics-line {
            display: inline-block;
            margin-top: 0.35rem;
            padding: 0.18rem 0.65rem;
            background: rgba(123, 44, 159, 0.08);
            color: var(--highlight-primary);
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }
        .feature-list {
            margin: 1.4rem 0 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 0.55rem;
            text-align: left;
            border-top: 1px solid rgba(226, 232, 240, 0.7);
            padding-top: 1.3rem;
        }
        .feature-list li {
            display: flex;
            align-items: flex-start;
            gap: 0.55rem;
            font-size: 0.83rem;
            color: var(--text-color);
            line-height: 1.45;
        }
        .feature-list .icon {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            margin-top: 2px;
            color: var(--highlight-primary);
        }
        .feature-list strong { color: var(--header-color); font-weight: 600; }
        .field {
            margin-bottom: 1rem;
            text-align: left;
        }
        .field input {
            width: 100%;
            padding: 0.75rem 0.95rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.55rem;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: #fff;
            color: var(--text-color);
        }
        .field input:focus {
            outline: none;
            border-color: var(--highlight-primary);
            box-shadow: 0 0 0 3px rgba(123, 44, 159, 0.18);
        }
        .field input:disabled {
            background: #f1f5f9;
            color: var(--text-muted-color);
            cursor: not-allowed;
        }
        .btn {
            width: 100%;
            padding: 0.78rem 1rem;
            font-size: 0.96rem;
            font-weight: 600;
            border-radius: 0.55rem;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.2s ease;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--highlight-primary), var(--highlight-secondary));
            color: #fff;
            box-shadow: 0 4px 14px rgba(123, 44, 159, 0.28);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .btn-primary svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(123, 44, 159, 0.36);
        }
        .btn-primary:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .btn-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            margin-top: 1.3rem;
            color: var(--text-muted-color);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            transition: color 0.2s ease, background 0.2s ease;
        }
        .btn-link:hover {
            color: var(--highlight-primary);
            background: rgba(123, 44, 159, 0.08);
        }
        .btn-link svg {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }
        .btn-link:hover svg { transform: translateX(2px); }
        .error-msg {
            margin: 0.6rem 0 0;
            font-size: 0.85rem;
            color: #b91c1c;
            min-height: 1.1rem;
            font-weight: 500;
        }
        .info-msg {
            margin: 0.6rem 0 0;
            font-size: 0.82rem;
            color: var(--text-muted-color);
            min-height: 1.1rem;
        }
        .footer {
            margin-top: 1.8rem;
            font-size: 0.78rem;
            color: var(--text-muted-color);
            text-align: center;
        }
        .footer a {
            color: var(--highlight-primary);
            text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="gate-card">
        <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.231 2.462 7.18 20.923h14.564V24H2.256v-2.462L16.308 3.076H2.975V0h18.256v2.462z"/></svg>
        </div>
        <h1>Robotics Daily Papers</h1>
        <p class="tagline">具身智能前沿论文调研<br>
            <span class="topics-line">VLA · 世界模型 · 自动驾驶 · 具身智能</span>
        </p>

        <p class="info-msg" style="min-height:0;line-height:1.65;margin:1rem 0;">
            网页版现为只读论文浏览。Add to Zotero、OneDrive 链接附件与本地 AI 精读
            统一由开源的 PaperReader Mac App 提供，网页端不再维护写入功能。
        </p>

        <a class="btn btn-primary" href="https://github.com/Robotics-paper-daily/Robotics-paper-daily.github.io#v030-paperreader-for-macos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 21h14"/></svg>
            <span>查看 PaperReader v0.3.0 发布状态</span>
        </a>

        <a class="btn-link" href="guest.html">
            继续浏览只读网页版
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>

    </div>

    <div class="footer">
        <a href="https://github.com/Robotics-paper-daily/Robotics-paper-daily.github.io" target="_blank" rel="noopener noreferrer">View on GitHub</a>
    </div>

</body>
</html>
