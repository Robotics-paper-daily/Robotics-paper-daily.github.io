<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文检索 - ArXiv Robotics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/minisearch@7/dist/umd/index.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .highlight { background-color: #f3e8ff; border-radius: 2px; padding: 0 2px; }
        .quick-nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            align-items: center;
            width: fit-content;
            margin: 0.9rem auto 1.4rem;
            padding: 0;
            border: none;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .quick-nav a {
            color: #7B2C9F;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            border: 1px solid rgba(226, 232, 240, 0.95);
            background: rgba(255, 255, 255, 0.86);
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
            transition: background-color 0.25s ease, color 0.25s ease, transform 0.2s ease;
        }
        .quick-nav a:hover {
            background-color: rgba(123, 44, 159, 0.12);
            color: #6B1F8F;
            transform: translateY(-1px);
        }
        .search-shell {
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
            padding: 1rem;
        }
        .repo-link {
            color: #7B2C9F;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease;
        }
        .repo-link:hover { opacity: 0.75; }
        .repo-icon {
            width: 22px;
            height: 22px;
            display: block;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
    <div class="container mx-auto px-4 py-8 max-w-4xl flex-1">
        <h1 class="text-3xl font-bold text-center text-slate-800 mb-2">论文检索</h1>
        <nav class="quick-nav">
            <a href="./index.html">首页</a>
            <a href="./list.html">报告列表</a>
        </nav>

        <div class="search-shell mb-6">
            <input id="search-input" type="text" placeholder="输入关键词搜索标题、摘要或作者..."
                class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-purple-500 text-lg bg-white">
        </div>
        <div id="status" class="text-center text-slate-400 mb-4">正在加载索引...</div>
        <div id="results" class="space-y-4"></div>
    </div>

    <footer class="h-[46px] border-t border-[#eee] flex items-center justify-center bg-white">
        <a class="repo-link" href="https://github.com/Robotics-paper-daily/Robotics-paper-daily.github.io" target="_blank" rel="noopener noreferrer" title="Project Repository" aria-label="Project Repository">
            <svg class="repo-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38
                0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
                .07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
                -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.7 7.7 0 0 1 2-.27c.68 0 1.36.09 2 .27
                1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15
                0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
                0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
        </a>
    </footer>

    <script>
        let papersMap = {};
        let miniSearch;
        const input = document.getElementById('search-input');
        const resultsDiv = document.getElementById('results');
        const statusDiv = document.getElementById('status');

        fetch('search_index.json?v=' + Date.now())
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then(data => {
                // 为每条记录添加 id，并预处理 authors 为字符串
                data.forEach((p, i) => {
                    p.id = i;
                    p.authorsText = (p.authors || []).join(', ');
                });
                papersMap = Object.fromEntries(data.map(p => [p.id, p]));

                miniSearch = new MiniSearch({
                    fields: ['title', 'summary', 'summary_zh', 'tldr', 'tldr_zh', 'authorsText'],
                    storeFields: ['title', 'summary', 'summary_zh', 'tldr', 'tldr_zh', 'url', 'date', 'authors', 'authorsText', 'categories', 'score'],
                    searchOptions: {
                        boost: { title: 5, authorsText: 3, tldr: 2, tldr_zh: 2, summary: 1, summary_zh: 1 },
                        combineWith: 'AND',
                        fuzzy: (term) => term.length > 5 ? 0.2 : false,
                        prefix: (term) => term.length >= 3,
                    },
                });
                miniSearch.addAll(data);
                statusDiv.textContent = `索引加载完成，共 ${data.length} 篇论文。输入关键词开始搜索。`;
                input.focus();
            })
            .catch(err => {
                console.error('Search index error:', err);
                statusDiv.innerHTML = `<span class="text-red-500">加载搜索索引失败: ${err.message}</span>`;
            });

        let debounceTimer;
        input.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(doSearch, 200);
        });

        function doSearch() {
            const query = input.value.trim();
            resultsDiv.innerHTML = '';
            if (!query || !miniSearch) {
                const total = Object.keys(papersMap).length;
                statusDiv.textContent = total ? `共 ${total} 篇论文。输入关键词开始搜索。` : '正在加载索引...';
                return;
            }
            const results = miniSearch.search(query);
            statusDiv.textContent = `找到 ${results.length} 篇匹配论文`;
            const shown = results.slice(0, 100);
            shown.forEach(r => {
                const p = papersMap[r.id];
                const card = document.createElement('div');
                card.className = 'bg-white rounded-lg shadow p-4 hover:shadow-md transition';
                const desc = p.tldr_zh || p.tldr || '';
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2 mb-1">
                        <a href="${p.url}" target="_blank" class="text-purple-700 font-semibold hover:underline leading-snug">${esc(p.title)}</a>
                        <span class="shrink-0 text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded">${p.date}</span>
                    </div>
                    <p class="text-slate-500 text-xs mb-1 italic">${esc(p.authorsText)}</p>
                    <p class="text-slate-600 text-sm mb-2">${esc(desc)}</p>
                    <div class="flex items-center gap-3 text-xs text-slate-400">
                        <span>${(p.categories || []).join(', ')}</span>
                        ${p.score ? '<span>⭐ ' + p.score + '</span>' : ''}
                    </div>`;
                resultsDiv.appendChild(card);
            });
            if (results.length > 100) {
                const more = document.createElement('p');
                more.className = 'text-center text-slate-400 text-sm';
                more.textContent = `仅显示前 100 条结果，共 ${results.length} 条匹配。请缩小搜索范围。`;
                resultsDiv.appendChild(more);
            }
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }
    </script></body>
</html>
