name: Daily arXiv Paper Fetch and Filter

on:
  schedule:
    # Runs 'at 00:00 UTC' every day (08:00 CST / Beijing time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: daily-arxiv-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Needed to push changes back to the repository
      pages: write        # Needed to deploy to GitHub Pages
      id-token: write     # Needed for OpenID Connect authentication with GitHub Pages

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x' # Use the latest available 3.x version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run script to fetch, filter, and generate report
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: python src/main.py --backfill

    - name: Build encrypted Zotero credentials bundle
      env:
        ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
        SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        PDF_PROXY_URL: ${{ secrets.PDF_PROXY_URL }}
        WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
        WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
        WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
      run: python build_secrets.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A -- daily_json/ daily_html/ index.html reports.json search_index.json search_index/ search.html list.html guest.html personal.html js/
        # secrets.enc.js is gitignored to keep it out of forks; force-add so
        # this workflow's regenerated bundle gets pushed for GitHub Pages.
        git add -f js/secrets.enc.js
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Update daily arXiv papers $(date +'%Y-%m-%d')"
          target_branch="${{ github.event.repository.default_branch }}"
          git pull --rebase origin "${target_branch}"
          git push origin "HEAD:${target_branch}"
        fi

